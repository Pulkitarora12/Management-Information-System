# Benchmark profile (Phase 3): ALWAYS points at mis_bench, never mis or mis_test.
spring.datasource.url=jdbc:mysql://localhost:3306/mis_bench?createDatabaseIfNotExist=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

logging.file.name=
logging.level.root=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

spring.mail.username=bench@example.com
spring.mail.password=bench
google.sheets.spreadsheet.id=bench
