# Test profile: ALWAYS points at mis_test, never the real mis database.
spring.datasource.url=jdbc:mysql://localhost:3306/mis_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# No baseline here: Flyway owns mis_test end to end and runs every migration from V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=false

# Keep test runs quiet and independent of the real app's log file.
logging.file.name=
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO

# Mail/Sheets/JWT aren't exercised by context-load tests; keep placeholders so the
# context can still start without requiring the real secrets to be set for test runs.
spring.mail.username=test@example.com
spring.mail.password=test
google.sheets.spreadsheet.id=test
