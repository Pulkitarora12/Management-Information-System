<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 40px 32px; max-width: 460px; width: 100%; text-align: center; }
        .icon { font-size: 44px; margin-bottom: 12px; }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: #718096; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
        a { display: inline-block; background: #667eea; color: white; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: 14px; }
        a:hover { background: #5568d3; }
    </style>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="box">
    <div class="icon">&#128274;</div>
    <h2>Access Denied</h2>
    <p>You don't have the authority or rights to do this, such as approving a new account.
       Please contact an administrator if you think this is a mistake.</p>
    <a th:href="@{/auth/dashboard}">Back to Dashboard</a>
</div>
</body>
</html>
