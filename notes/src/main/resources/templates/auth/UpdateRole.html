<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Assign User Roles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/output.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h2 {
            color: #1a202c;
            font-size: 28px;
            font-weight: 700;
        }

        .success-message {
            background: #c6f6d5;
            border: 1px solid #9ae6b4;
            color: #22543d;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 16px;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .user-info {
            min-width: 220px;
        }

        .user-info .name {
            font-weight: 600;
            color: #1a202c;
        }

        .user-info .email {
            color: #718096;
            font-size: 13px;
        }

        .roles {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .role-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #4a5568;
        }

        button[type="submit"] {
            padding: 8px 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: #5568d3;
        }

        .back-link-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }

        .back-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Assign User Roles</h2>
        </div>

        <div th:if="${success}" class="success-message">
            <p th:text="${success}"></p>
        </div>

        <div class="card" th:each="u : ${users}">
            <form th:action="@{/admin/update-role}" method="post">
                <input type="hidden" name="userId" th:value="${u.userId}">
                <div class="user-row">
                    <div class="user-info">
                        <div class="name" th:text="${u.employeeFullName != null ? u.employeeFullName : u.userName}"></div>
                        <div class="email" th:text="${u.email}"></div>
                    </div>
                    <div class="roles">
                        <label class="role-checkbox" th:each="r : ${allRoles}">
                            <input type="checkbox" name="roleIds" th:value="${r.id}"
                                   th:checked="${assignedRoleIdsByUser.get(u.userId) != null and assignedRoleIdsByUser.get(u.userId).contains(r.id)}">
                            <span th:text="${r.name}"></span>
                        </label>
                    </div>
                    <button type="submit">Save</button>
                </div>
            </form>
        </div>

        <div class="back-link-container">
            <a th:href="@{/admin/roles}" class="back-link">Manage Roles &amp; Permissions</a>
        </div>
    </div>
    <div th:replace="~{fragments/back-to-dashboard :: button}"></div>
</body>
</html>
