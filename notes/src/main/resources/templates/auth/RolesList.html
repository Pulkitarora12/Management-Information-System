<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Roles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/output.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f0f4f8; min-height: 100vh; padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        h2 { color: #1a202c; font-size: 28px; font-weight: 700; }
        .new-role-link {
            background: #667eea; color: white; padding: 10px 18px; border-radius: 8px;
            text-decoration: none; font-weight: 600; font-size: 14px;
        }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid #e2e8f0; }
        th { color: #718096; font-size: 12px; text-transform: uppercase; }
        .role-key { font-family: monospace; color: #4a5568; }
        .system-badge {
            background: #edf2f7; color: #4a5568; font-size: 11px; padding: 2px 8px;
            border-radius: 6px; margin-left: 6px;
        }
        .manage-link { color: #667eea; text-decoration: none; font-weight: 500; }
        .manage-link:hover { text-decoration: underline; }
        .back-link-container {
            text-align: center; background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 16px;
        }
        .back-link { color: #667eea; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Roles &amp; Permissions</h2>
        <a class="new-role-link" th:href="@{/admin/roles/new}">+ New Role</a>
    </div>
    <div class="card">
        <table>
            <thead>
            <tr><th>Name</th><th>Key</th><th>Description</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${roles}">
                <td>
                    <span th:text="${r.name}"></span>
                    <span th:if="${r.systemRole}" class="system-badge">system</span>
                </td>
                <td class="role-key" th:text="${r.roleKey}"></td>
                <td th:text="${r.description}"></td>
                <td><a class="manage-link" th:href="@{/admin/roles/{id}/permissions(id=${r.id})}">Permissions</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="back-link-container">
        <a th:href="@{/admin/update-role}" class="back-link">Assign Roles to Users</a>
        &nbsp;|&nbsp;
        <a th:href="@{/auth/dashboard}" class="back-link">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
