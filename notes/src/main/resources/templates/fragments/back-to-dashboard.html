<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  One consistent "Back to Dashboard" button, included the same way on every
  authenticated screen via: <div th:replace="~{fragments/back-to-dashboard :: button}"></div>
  Fixed position + fully inline styles so it renders identically regardless of
  whatever CSS the host page already has (Tailwind, bespoke <style> blocks, etc.)
  and never collides with a page's own button classes.
-->
<div th:fragment="button">
    <a th:href="@{/auth/dashboard}"
       style="position:fixed;bottom:24px;left:24px;z-index:1000;
              display:inline-flex;align-items:center;gap:8px;
              background:#667eea;color:#ffffff;text-decoration:none;
              padding:12px 20px;border-radius:999px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
              font-size:14px;font-weight:600;
              box-shadow:0 4px 12px rgba(102,126,234,0.4);
              transition:background 0.2s ease, transform 0.2s ease;"
       onmouseover="this.style.background='#5568d3';this.style.transform='translateY(-2px)';"
       onmouseout="this.style.background='#667eea';this.style.transform='translateY(0)';">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Dashboard
    </a>
</div>
</body>
</html>
