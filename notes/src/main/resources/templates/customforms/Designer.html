<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/output.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 760px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; margin-bottom: 20px; }
        h2 { color: #1a202c; font-size: 24px; margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #4a5568; font-weight: 600; margin-bottom: 6px; margin-top: 14px; }
        input[type=text], select { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; padding: 10px 0; border-bottom: 1px solid #f0f4f8; }
        .field-row label { margin-top: 0; }
        .required-check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        #fields-container { margin-top: 10px; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #edf2f7; color: #4a5568; margin-top: 10px; }
        .btn-row { margin-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
<div class="container">
    <form th:action="@{/custom-forms/new}" method="post">
        <div class="card">
            <h2>New Custom Form</h2>
            <label for="name">Form Name</label>
            <input type="text" id="name" name="name" required>
            <label for="formKey">Form Key</label>
            <input type="text" id="formKey" name="formKey" required placeholder="e.g. inspection_report">
            <label for="description">Description</label>
            <input type="text" id="description" name="description">
        </div>
        <div class="card">
            <h2>Fields</h2>
            <div id="fields-container"></div>
            <button type="button" class="btn btn-secondary" onclick="addFieldRow()">+ Add Field</button>
        </div>
        <div class="btn-row">
            <button type="submit" class="btn btn-primary">Create Form</button>
        </div>
    </form>
</div>
<div th:replace="~{fragments/back-to-dashboard :: button}"></div>
<script th:inline="javascript">
    const fieldTypes = /*[[${fieldTypes}]]*/ [];
    let rowCount = 0;
    function addFieldRow() {
        const container = document.getElementById('fields-container');
        const row = document.createElement('div');
        row.className = 'field-row';
        const optionsHtml = fieldTypes.map(t => `<option value="${t}">${t}</option>`).join('');
        row.innerHTML = `
            <div><label>Field Key</label><input type="text" name="field_key" required></div>
            <div><label>Label</label><input type="text" name="field_label" required></div>
            <div><label>Type</label><select name="field_type">${optionsHtml}</select></div>
            <div class="required-check">
                <input type="hidden" name="field_required" value="false">
                <input type="checkbox" onchange="this.previousElementSibling.value = this.checked ? 'true' : 'false'">
                <span>Required</span>
            </div>
        `;
        container.appendChild(row);
        rowCount++;
    }
    addFieldRow();
</script>
</body>
</html>
