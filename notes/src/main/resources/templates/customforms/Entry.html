<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${form.name}">Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/output.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; }
        h2 { color: #1a202c; font-size: 24px; margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #4a5568; font-weight: 600; margin-bottom: 6px; margin-top: 14px; }
        input[type=text], input[type=number], input[type=date] { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 20px; }
        .btn-primary { background: #667eea; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2 th:text="${form.name}"></h2>
        <form th:action="${submissionId} == null ? @{/custom-forms/{id}/entry(id=${form.id})} : @{/custom-forms/{id}/entry/{sid}(id=${form.id},sid=${submissionId})}"
              method="post">
            <div th:each="field : ${form.fields}">
                <label th:text="${field.label} + (${field.required} ? ' *' : '')"></label>

                <input th:if="${field.type.name() == 'TEXT' or field.type.name() == 'MASTER_REF' or field.type.name() == 'FILE'}"
                       type="text" th:name="'f_' + ${field.fieldKey}" th:value="${values.get(field.fieldKey)}"
                       th:required="${field.required}">

                <input th:if="${field.type.name() == 'NUMBER'}"
                       type="number" th:name="'f_' + ${field.fieldKey}" th:value="${values.get(field.fieldKey)}"
                       th:required="${field.required}">

                <input th:if="${field.type.name() == 'DECIMAL'}"
                       type="number" step="0.01" th:name="'f_' + ${field.fieldKey}" th:value="${values.get(field.fieldKey)}"
                       th:required="${field.required}">

                <input th:if="${field.type.name() == 'DATE'}"
                       type="date" th:name="'f_' + ${field.fieldKey}" th:value="${values.get(field.fieldKey)}"
                       th:required="${field.required}">

                <select th:if="${field.type.name() == 'BOOLEAN'}" th:name="'f_' + ${field.fieldKey}">
                    <option value="false" th:selected="${values.get(field.fieldKey)} == false">No</option>
                    <option value="true" th:selected="${values.get(field.fieldKey)} == true">Yes</option>
                </select>

                <input th:if="${field.type.name() == 'DROPDOWN'}"
                       type="text" th:name="'f_' + ${field.fieldKey}" th:value="${values.get(field.fieldKey)}"
                       th:required="${field.required}">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/back-to-dashboard :: button}"></div>
</body>
</html>
