<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title th:text="${form.name}">View Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/output.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { background: white; padding: 24px 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h2 { color: #1a202c; font-size: 24px; }
        .new-link { background: #667eea; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        th { color: #718096; font-size: 12px; text-transform: uppercase; }
        .edit-link { color: #667eea; text-decoration: none; font-weight: 500; margin-right: 10px; }
        .delete-btn { background: none; border: none; color: #e53e3e; font-weight: 500; cursor: pointer; padding: 0; }
        .empty { color: #718096; text-align: center; padding: 30px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 th:text="${form.name}"></h2>
        <a th:if="${@authz.can('FORM_' + form.id, 'CREATE')}" class="new-link"
           th:href="@{/custom-forms/{id}/entry(id=${form.id})}">+ New Entry</a>
    </div>
    <div class="card">
        <table>
            <thead>
            <tr>
                <th th:each="field : ${form.fields}" th:text="${field.label}"></th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${records}">
                <td th:each="field : ${form.fields}" th:text="${r.values().get(field.fieldKey)}"></td>
                <td>
                    <a class="edit-link" th:if="${@authz.can('FORM_' + form.id, 'EDIT')}"
                       th:href="@{/custom-forms/{id}/entry/{sid}(id=${form.id},sid=${r.submissionId()})}">Edit</a>
                    <form style="display:inline" method="post" th:if="${@authz.can('FORM_' + form.id, 'DELETE')}"
                          th:action="@{/custom-forms/{id}/entry/{sid}/delete(id=${form.id},sid=${r.submissionId()})}">
                        <button type="submit" class="delete-btn" onclick="return confirm('Delete this entry?')">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(records)}">No entries yet.</div>
    </div>
</div>
<div th:replace="~{fragments/back-to-dashboard :: button}"></div>
</body>
</html>
