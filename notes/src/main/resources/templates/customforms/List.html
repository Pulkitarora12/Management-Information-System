<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Custom Forms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/output.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h2 { color: #1a202c; font-size: 28px; font-weight: 700; }
        .new-link { background: #667eea; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .form-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; }
        .form-card h3 { color: #1a202c; font-size: 18px; margin-bottom: 6px; }
        .form-card p { color: #718096; font-size: 13px; margin-bottom: 16px; }
        .form-card .actions { display: flex; gap: 10px; }
        .btn { padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; }
        .btn-view { background: #edf2f7; color: #4a5568; }
        .btn-entry { background: #667eea; color: white; }
        .empty { color: #718096; text-align: center; padding: 40px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Custom Forms</h2>
        <a sec:authorize="@authz.can('FORM_BUILDER','CREATE')" class="new-link" th:href="@{/custom-forms/new}">+ Create Form</a>
    </div>
    <div class="grid">
        <div class="form-card" th:each="f : ${forms}"
             th:if="${@authz.can('FORM_' + f.id, 'VIEW') or @authz.can('FORM_' + f.id, 'CREATE')}">
            <h3 th:text="${f.name}"></h3>
            <p th:text="${f.description}"></p>
            <div class="actions">
                <a class="btn btn-view" th:if="${@authz.can('FORM_' + f.id, 'VIEW')}"
                   th:href="@{/custom-forms/{id}/view(id=${f.id})}">View</a>
                <a class="btn btn-entry" th:if="${@authz.can('FORM_' + f.id, 'CREATE')}"
                   th:href="@{/custom-forms/{id}/entry(id=${f.id})}">Entry</a>
            </div>
        </div>
        <div class="empty" th:if="${#lists.isEmpty(forms)}">No forms yet.</div>
    </div>
</div>
<div th:replace="~{fragments/back-to-dashboard :: button}"></div>
</body>
</html>
